services:
  - type: web
    name: aegisclaw-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./aegisclaw.db
      - key: REDIS_URL
        sync: false
