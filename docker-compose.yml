version: '3.8'

services:
  proxy:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./cedar/policies:/app/cedar/policies
    depends_on:
      - redis
      - postgres
    networks:
      - aegisclaw-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - aegisclaw-network
    depends_on:
      - proxy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - aegisclaw-network

  cedar-pdp:
    image: permitio/cedar-agent:latest
    ports:
      - "8180:8180"
    volumes:
      - ./cedar/policies:/cedar/policies
    networks:
      - aegisclaw-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aegisclaw-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - proxy
      - frontend
    networks:
      - aegisclaw-network

networks:
  aegisclaw-network:
    driver: bridge

volumes:
  pgdata:
